<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Velora Formazione</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--color-navy-bg); color: var(--color-text); padding: 40px; font-family: var(--font-body); }
    h1, h2, h3 { font-family: var(--font-heading); color: var(--color-gold-bright); }
    .card { background: #11223F; border: 1px solid rgba(200, 157, 66, 0.2); padding: 20px; border-radius: 12px; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { color: var(--color-gold-primary); }
    input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 250px; margin-right: 10px; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; margin-right: 5px; cursor: pointer; }
    .btn-danger { background: #ff4757; color: white; border: none; border-radius: 4px; }
    .btn-warning { background: #ffa502; color: white; border: none; border-radius: 4px; }
  </style>
  <script>
    // Security check
    fetch('backend/api.php?action=check_session')
      .then(res => res.json())
      .then(data => {
        if (data.status !== 'success' || data.role !== 'admin') {
          window.location.href = 'accedi.html';
        } else {
          loadUsers();
        }
      });

    function logout() {
      fetch('backend/api.php?action=logout').then(() => window.location.href = 'accedi.html');
    }

    function loadUsers() {
      fetch('backend/api.php?action=list_users')
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            data.users.forEach(user => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${user.email}</td>
                <td><input type="text" id="pwd-${user.id}" value="${user.password}" style="width:120px; padding:4px;"> 
                    <button class="btn btn-secondary btn-sm" onclick="changePwd('${user.id}')">Update</button></td>
                <td>
                  <span style="color: ${user.status === 'active' ? '#2ed573' : '#ff4757'}">${user.status.toUpperCase()}</span>
                </td>
                <td>
                  <button class="btn btn-warning btn-sm" onclick="toggleBlock('${user.id}')">${user.status === 'active' ? 'Block' : 'Unblock'}</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteUser('${user.id}')">Delete</button>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        });
    }

    function createUser(e) {
      e.preventDefault();
      const email = document.getElementById('new-email').value;
      const pwd = document.getElementById('new-pwd').value;
      
      fetch('backend/api.php?action=create_user', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email, password: pwd})
      }).then(res => res.json()).then(data => {
        alert(data.message);
        if (data.status === 'success') {
          document.getElementById('new-email').value = '';
          document.getElementById('new-pwd').value = '';
          loadUsers();
        }
      });
    }

    function changePwd(id) {
      const newPwd = document.getElementById('pwd-' + id).value;
      fetch('backend/api.php?action=change_password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: id, new_password: newPwd})
      }).then(res => res.json()).then(data => {
        alert(data.message);
        loadUsers();
      });
    }

    function toggleBlock(id) {
      fetch('backend/api.php?action=toggle_block', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: id})
      }).then(res => res.json()).then(data => {
        loadUsers();
      });
    }

    function deleteUser(id) {
      if(confirm("Are you sure you want to delete this student?")) {
        fetch('backend/api.php?action=delete_user', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({user_id: id})
        }).then(res => res.json()).then(data => {
          alert(data.message);
          loadUsers();
        });
      }
    }
  </script>
</head>
<body>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h1>Velora Formazione - Admin Panel</h1>
    <button class="btn btn-primary" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h2>Create New Student</h2>
    <form onsubmit="createUser(event)" style="margin-top: 15px;">
      <input type="email" id="new-email" placeholder="Student Email" required>
      <input type="text" id="new-pwd" placeholder="Temporary Password" required>
      <button type="submit" class="btn btn-secondary">Create Student</button>
    </form>
  </div>

  <div class="card">
    <h2>Manage Students</h2>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Password</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="user-table-body">
        <!-- JS renders here -->
      </tbody>
    </table>
  </div>

</body>
</html>
